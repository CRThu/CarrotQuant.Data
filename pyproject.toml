[project]
name = "carrotquant-data"
version = "1.2.3"
description = "高性能、轻量级 A 股与指数金融数据增量同步与持久化流水线"
readme = "README.md"
authors = [
    { name = "Carrot", email = "11172391+CRThu@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "baostock>=0.9.1",
    "curl_cffi>=0.7.4",
    "fastapi>=0.135.1",
    "loguru>=0.7.3",
    "polars>=1.39.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "tdxpy>=0.2.7",
    "tenacity>=9.1.4",
    "typer>=0.24.1",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "bump-my-version>=1.0.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.15.1",
]
[project.scripts]
cqdata = "cqdata.entrypoints.cli:app"

[tool.uv]
package = true

[tool.hatch.build]
artifacts = [
    "cqdata/static/**",
]

[tool.hatch.build.targets.wheel]
packages = ["cqdata"]




[tool.pytest.ini_options]
addopts = "--ignore=demo"
markers = [
    "network: 标记需要连接真实外部网络的集成测试"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.bumpversion]
current_version = "1.2.3"
commit = true
tag = true
allow_dirty = true
tag_name = "v{new_version}"
message = "chore(release): bump version {current_version} → {new_version}"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "cqdata/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
