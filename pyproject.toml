[project]
name = "carrotquant-data"
version = "0.1.1"
description = "高性能、轻量级 A 股与指数金融数据增量同步与持久化流水线"
readme = "README.md"
authors = [
    { name = "Carrot", email = "11172391+CRThu@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "baostock>=0.9.1",
    "curl_cffi>=0.7.4",
    "fastapi>=0.135.1",
    "loguru>=0.7.3",
    "polars>=1.39.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyyaml>=6.0.3",
    "tdxpy>=0.2.7",
    "tenacity>=9.1.4",
    "typer>=0.24.1",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]
[project.scripts]
cqdata = "cqdata.entrypoints.cli:app"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["cqdata"]

[tool.pytest.ini_options]
addopts = "--ignore=demo"
markers = [
    "network: 标记需要连接真实外部网络的集成测试"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
