name: Publish to PyPI and Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC) 必需权限
      contents: write  # 创建 GitHub Release 权限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 构建 Web 前端静态资源 (使用 Bun 极速构建，输出到 cqdata/static)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Web UI
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build

      # 2. 安装 uv 并打包 Python Wheel (包含 static 资源)
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      # 3. 通过 OIDC 免密发布到 PyPI
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # 4. 自动创建 GitHub Release 并附加 dist/ 产物
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: dist/*
